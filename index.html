<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebCord — Discord Bot Client</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#191b22;--panel2:#20232c;--line:#2c303b;--text:#eef0f6;--muted:#9ca3b4;--accent:#8b9cff;--green:#64d6a0;--red:#ff7e88}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;height:100dvh;overflow:hidden}.app{height:100vh;height:100dvh;min-height:0;overflow:hidden;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}aside{background:#15171d;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.brand{height:66px;padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;font-weight:750;font-size:16px;letter-spacing:.2px}.logo{width:31px;height:31px;border-radius:10px;background:linear-gradient(135deg,#9aaaff,#6978e6);display:grid;place-items:center;color:white;font-weight:900}.side-content{padding:16px 12px;overflow:auto;flex:1}.eyebrow{font-size:10px;color:#82899a;font-weight:800;letter-spacing:1.25px;margin:6px 8px 9px}.connect{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}.connect label{font-size:12px;color:var(--muted);display:block;margin-bottom:7px}.connect input,.select-wrap select{width:100%;border:1px solid var(--line);background:#111318;color:var(--text);border-radius:8px;padding:10px 11px;outline:none}.connect input:focus,.select-wrap select:focus,textarea:focus{border-color:var(--accent)}button{font:inherit;cursor:pointer;border:0}.primary{width:100%;padding:9px 12px;background:#747ff0;color:white;border-radius:8px;font-weight:700;margin-top:9px}.primary:hover{background:#858ffb}.hint{font-size:11px;color:var(--muted);margin:9px 1px 0;line-height:1.55}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;padding:14px 9px 6px}.dot{width:8px;height:8px;border-radius:50%;background:#737989}.dot.on{background:var(--green);box-shadow:0 0 8px #64d6a055}.section{margin-top:22px}.select-wrap{padding:0 4px}.select-wrap select{appearance:none;cursor:pointer}.server-list{margin-top:20px}.navitem{display:flex;align-items:center;gap:9px;color:#aeb4c2;padding:8px 10px;border-radius:7px;font-size:13px}.navitem.active{color:white;background:#282b38}.navitem .icon{width:19px;text-align:center;color:#a5aeff}.foot{padding:13px 16px;border-top:1px solid var(--line);font-size:11px;color:#7f8695}.main{min-width:0;min-height:0;height:100%;overflow:hidden;display:grid;grid-template-rows:66px minmax(0,1fr) auto}.topbar{height:66px;min-height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.channel-title{font-weight:750;font-size:15px}.channel-sub{color:var(--muted);font-size:11px;margin-top:2px}.top-actions{display:flex;gap:8px;align-items:center}.subtle{background:var(--panel2);color:#c8ccda;padding:8px 11px;border-radius:7px;font-size:12px}.subtle:hover{background:#2b2f3b}.chat{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:26px max(24px,calc((100% - 900px)/2));scroll-behavior:smooth}.welcome{height:100%;display:grid;place-items:center;text-align:center}.welcome-card{max-width:440px}.welcome-mark{width:62px;height:62px;background:#252938;border:1px solid #34394d;border-radius:20px;display:grid;place-items:center;font-size:28px;margin:0 auto 18px}.welcome h1{font-size:22px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0;line-height:1.7}.empty-note{margin-top:18px;display:inline-block;border:1px solid var(--line);padding:8px 12px;border-radius:8px;font-size:11px;color:#bbc0ce}.message{display:grid;grid-template-columns:38px 1fr;gap:12px;margin:0 0 22px}.avatar{width:36px;height:36px;border-radius:50%;background:#343950;display:grid;place-items:center;color:#d5d9ff;font-weight:750;font-size:13px}.msg-head{display:flex;align-items:baseline;gap:9px;margin:1px 0 4px}.author{font-weight:700}.time{font-size:10px;color:#747b8b}.content{white-space:pre-wrap;overflow-wrap:anywhere;color:#d8dbe4;line-height:1.6}.composer-area{position:relative;z-index:1;background:var(--bg);padding:0 max(24px,calc((100% - 900px)/2)) max(22px,env(safe-area-inset-bottom))}.composer{background:#20232b;border:1px solid #303440;border-radius:12px;padding:10px 12px;display:flex;align-items:flex-end;gap:10px}.composer textarea{resize:none;max-height:150px;min-height:26px;flex:1;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:4px}.send{background:#7b87f5;color:white;border-radius:8px;width:36px;height:34px;font-size:17px}.send:disabled{opacity:.35;cursor:not-allowed}.compose-help{font-size:10px;color:#767d8d;padding:7px 4px 0}.toast{position:fixed;right:20px;top:18px;background:#282b34;border:1px solid var(--line);padding:11px 15px;border-radius:9px;box-shadow:0 10px 30px #0006;max-width:360px;z-index:3}.toast.error{border-color:#804850;color:#ffc5cb}.hidden{display:none!important}.mobile-head{display:none}@media(max-width:700px){.app{grid-template-columns:205px minmax(0,1fr)}.topbar{padding:0 14px}.chat{padding:20px 14px}.composer-area{padding:0 14px 14px}.top-actions .subtle{font-size:0}.top-actions .subtle:first-letter{font-size:12px}}@media(max-width:540px){.app{grid-template-columns:1fr}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;z-index:2;transform:translateX(-100%);transition:transform .2s;box-shadow:12px 0 30px #0006}.sidebar.open{transform:translateX(0)}.mobile-head{display:block;background:none;color:#cdd2df;font-size:20px;padding:4px 9px 4px 0}.topbar{gap:10px}.channel-title{font-size:14px}}

/* Discord-inspired frame: only the message list scrolls. */
body{background:#313338;color:#dbdee1;height:100vh;height:100dvh;overflow:hidden}
.app{height:100vh;height:100dvh;min-height:0;overflow:hidden;grid-template-columns:68px 258px minmax(0,1fr);grid-template-rows:minmax(0,1fr);background:#313338}
.server-rail{grid-column:1;grid-row:1;min-height:0;overflow-y:auto;background:#1e1f22;display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 0}
.server-icon{width:46px;height:46px;flex:none;border-radius:50%;background:#313338;color:#dbdee1;font-weight:750;font-size:14px;transition:border-radius .15s,background .15s;position:relative}
.server-icon:hover,.server-icon.selected{border-radius:16px;background:#5865f2;color:#fff}
.server-icon.selected:before{content:"";position:absolute;left:-11px;top:9px;width:4px;height:28px;border-radius:0 4px 4px 0;background:#fff}
.server-icon.home{border-radius:16px;background:#5865f2;color:#fff;font-size:18px}
.rail-divider{width:32px;height:2px;background:#35363c;border-radius:2px;margin:1px 0}
.sidebar{grid-column:2;grid-row:1;position:relative;inset:auto;width:auto;transform:none;box-shadow:none;background:#2b2d31;border-right:0;min-height:0}
.brand{height:52px;min-height:52px;padding:0 16px;border-bottom:1px solid #232428;font-size:15px;background:#2b2d31}
.side-content{min-height:0;padding:14px 10px;scrollbar-width:thin;scrollbar-color:#1a1b1e transparent}
.eyebrow{margin:8px 8px 8px;color:#949ba4;font-size:10px;letter-spacing:.9px}
.connect{border-radius:8px;padding:10px;background:#232428;border-color:#232428}
.connect input,.select-wrap select{background:#1e1f22;border-color:#1e1f22;border-radius:5px;padding:9px 10px}
.primary{background:#5865f2;border-radius:5px}.primary:hover{background:#4752c4}
.status{padding:12px 8px 4px;color:#b5bac1}
.section{margin-top:16px}.section .select-wrap{padding:0 2px}
.channel-section{margin-top:20px}.channel-list{display:flex;flex-direction:column;gap:2px;padding:0 2px}
.channel-item{width:100%;min-height:34px;text-align:left;display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:5px;background:transparent;color:#949ba4;font-weight:500;overflow:hidden}
.channel-item:hover{background:#35373c;color:#dbdee1}.channel-item.active{background:#404249;color:#fff}
.channel-item .hash{font-size:19px;line-height:1;color:#777d87}.channel-item.active .hash{color:#dbdee1}
.channel-empty{padding:8px;color:#949ba4;font-size:12px}.select-wrap select#guildSelect{background:#232428;border-color:#232428;border-radius:5px}
.foot{border-top:1px solid #232428;background:#232428;color:#949ba4;padding:11px 14px}
.main{grid-column:3;grid-row:1;min-width:0;min-height:0;height:100%;overflow:hidden;display:grid;grid-template-rows:56px minmax(0,1fr) auto;background:#313338}
.topbar{height:56px;min-height:56px;padding:0 20px;border-bottom:1px solid #26272d;background:#313338}
.channel-title{font-size:15px}.channel-sub{color:#949ba4;font-size:11px}
.subtle{background:#383a40;color:#dbdee1;border-radius:5px}.subtle:hover{background:#404249}
.chat{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px max(20px,calc((100% - 860px)/2));scrollbar-width:thin;scrollbar-color:#1e1f22 transparent}
.message{grid-template-columns:40px 1fr;gap:14px;margin:0 -8px 2px;padding:7px 8px;border-radius:4px}.message:hover{background:#2e3035}
.avatar{width:38px;height:38px;background-color:#404249}.author{font-size:14px}.time{font-size:10px;color:#949ba4}.content{color:#dbdee1}
.composer-area{position:relative;z-index:1;background:#313338;padding:0 max(20px,calc((100% - 860px)/2)) max(20px,env(safe-area-inset-bottom))}
.composer{background:#383a40;border:0;border-radius:8px;padding:10px 12px;gap:10px}.composer textarea{color:#dbdee1}.composer textarea::placeholder{color:#949ba4}.send{background:#5865f2;border-radius:6px}.send:hover{background:#4752c4}.compose-help{color:#949ba4}
@media(max-width:700px){.app{grid-template-columns:60px 220px minmax(0,1fr)}}
@media(max-width:540px){.app{grid-template-columns:0 minmax(0,1fr)}.server-rail{display:none}.sidebar{position:fixed;inset:0 auto 0 0;width:258px;z-index:2;transform:translateX(-100%);transition:transform .2s;box-shadow:12px 0 30px #0006}.sidebar.open{transform:translateX(0)}.main{grid-column:2}.topbar{padding:0 12px}.chat{padding:16px 12px}.composer-area{padding:0 12px max(14px,env(safe-area-inset-bottom))}.message{gap:10px}}
</style></head>
<body><div class="app"><nav class="server-rail" id="serverRail" aria-label="サーバー"><button class="server-icon home selected" title="WebCord">W</button></nav><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">W</div> WebCord <span style="font-size:10px;color:#858c9d;font-weight:600">BOT CLIENT</span></div><div class="side-content"><div class="eyebrow">接続</div><div class="connect"><label for="token">Discord Bot Token</label><input id="token" type="password" placeholder="Bot tokenを入力" autocomplete="off" spellcheck="false"><button class="primary" id="connectBtn">接続する</button><div class="hint">トークンは保存せず、このタブ内だけで使用します。共有端末では切断後にタブを閉じてください。</div></div><div class="status"><span class="dot" id="statusDot"></span><span id="statusText">未接続</span></div><div class="section"><div class="eyebrow">サーバー</div><div class="select-wrap"><select id="guildSelect" disabled><option>接続後に表示</option></select></div></div><div class="section channel-section"><div class="eyebrow">テキストチャンネル</div><div class="channel-list" id="channelItems"><div class="channel-empty">Botを接続してください</div></div><select id="channelSelect" hidden disabled><option>サーバーを選択</option></select></div></div><div class="foot">WebCord · Bot接続</div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;min-width:0"><button class="mobile-head" id="menuBtn" aria-label="メニュー">☰</button><div><div class="channel-title" id="title">チャンネルを選択</div><div class="channel-sub" id="subtitle">Bot API経由で接続します</div></div></div><div class="top-actions"><button class="subtle" id="refreshBtn" disabled>↻　更新</button><button class="subtle" id="disconnectBtn" disabled>切断</button></div></header><section class="chat" id="chat"><div class="welcome"><div class="welcome-card"><div class="welcome-mark">✦</div><h1>WebCordへようこそ</h1><p>左側にBotトークンを入力して接続すると、Botが参加しているサーバーのチャンネルを選んで会話できます。</p><span class="empty-note">Botに必要な権限：チャンネル閲覧・メッセージ送信</span></div></div></section><div class="composer-area"><div class="composer"><textarea id="messageInput" rows="1" placeholder="チャンネルを選択してください" disabled></textarea><button class="send" id="sendBtn" disabled aria-label="送信">➤</button></div><div class="compose-help">Enterで送信 · Shift+Enterで改行</div></div></main></div><div class="toast hidden" id="toast"></div>
<script>
(()=>{'use strict';
const API='/api/discord?path=';const $=id=>document.getElementById(id);
let token='',guilds=[],channels=[],currentChannel=null,currentMessages=[],seenMessageIds=new Set();
let gatewaySocket=null,gatewayUrl='',gatewaySession=null,gatewaySeq=null,heartbeatTimer=null,reconnectTimer=null,reconnectAttempts=0,intentionalClose=false,gatewayFailed=false;
const GATEWAY_INTENTS=1|512|32768;
const safe=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(msg,error=false){const t=$('toast');t.textContent=msg;t.className='toast'+(error?' error':'');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.add('hidden'),5200)}
async function api(path,opts={}){const res=await fetch(API+encodeURIComponent(path),{...opts,headers:{'X-Bot-Token':token,'Content-Type':'application/json',...(opts.headers||{})}});if(!res.ok){const raw=await res.text();let detail='';try{const data=JSON.parse(raw);detail=data.message||data.error||''}catch{}throw Error(detail||`API エラー (${res.status}): ${raw.slice(0,240)}`)}return res.status===204?null:res.json()}
function status(text,on=false){$('statusText').textContent=text;$('statusDot').classList.toggle('on',on)}
function setBusy(v){$('connectBtn').disabled=v;$('connectBtn').textContent=v?'接続中…':'接続する'}
function resetChat(){currentMessages=[];seenMessageIds.clear();$('chat').innerHTML='<div class="welcome"><div class="welcome-card"><div class="welcome-mark">✦</div><h1>チャンネルを選択</h1><p>サーバーとテキストチャンネルを選ぶと、最近のメッセージが表示されます。</p></div></div>';$('messageInput').disabled=true;$('messageInput').placeholder='チャンネルを選択してください';$('sendBtn').disabled=true;$('title').textContent='チャンネルを選択';$('subtitle').textContent='メッセージはリアルタイムで届きます'}
function renderGuilds(){const rail=$('serverRail');rail.innerHTML='<button class="server-icon home selected" title="WebCord" aria-label="WebCord">W</button><span class="rail-divider"></span>'+guilds.map(g=>`<button class="server-icon ${g.id===$('guildSelect').value?'selected':''}" data-guild="${safe(g.id)}" title="${safe(g.name)}" aria-label="${safe(g.name)}">${safe((g.name||'?').trim().slice(0,2).toUpperCase())}</button>`).join('');rail.querySelectorAll('[data-guild]').forEach(b=>b.addEventListener('click',()=>{$('guildSelect').value=b.dataset.guild;$('guildSelect').dispatchEvent(new Event('change'))}))}
async function connect(){const val=$('token').value.trim();if(!val)return notify('Botトークンを入力してください',true);token=val;setBusy(true);intentionalClose=false;gatewayFailed=false;try{const me=await api('/users/@me');if(!me.bot)throw Error('このトークンはBotアカウントではありません');guilds=await api('/users/@me/guilds');$('guildSelect').innerHTML='<option value="">サーバーを選択</option>'+guilds.map(g=>`<option value="${safe(g.id)}">${safe(g.name)}</option>`).join('');$('guildSelect').disabled=false;renderGuilds();$('channelSelect').disabled=true;$('disconnectBtn').disabled=false;$('refreshBtn').disabled=true;status(`${me.username} · Gateway接続中`,true);$('subtitle').textContent=`${me.username} · ${guilds.length} サーバー`;$('sidebar').classList.remove('open');notify('Botとして接続しました');startGateway().catch(e=>{status('Gateway接続失敗');notify(e.message,true)})}catch(e){token='';status('接続できません');notify(e.message+'。Botトークンと権限を確認してください。',true)}finally{setBusy(false)}}
function stopGateway(){intentionalClose=true;gatewayFailed=true;clearInterval(heartbeatTimer);clearTimeout(reconnectTimer);heartbeatTimer=null;reconnectTimer=null;if(gatewaySocket){const ws=gatewaySocket;gatewaySocket=null;ws.close(1000,'Client disconnect')}gatewaySession=null;gatewaySeq=null;gatewayUrl=''}
async function startGateway(){if(!token||intentionalClose||gatewayFailed||gatewaySocket)return;if(!gatewayUrl){const info=await api('/gateway/bot');gatewayUrl=info.url}const url=gatewayUrl+(gatewayUrl.includes('?')?'&':'?')+'v=10&encoding=json';const ws=new WebSocket(url);gatewaySocket=ws;let ack=true;ws.onmessage=event=>{let p;try{p=JSON.parse(event.data)}catch{return}if(p.s!==null&&p.s!==undefined)gatewaySeq=p.s;if(p.op===10){clearInterval(heartbeatTimer);ack=true;const beat=()=>{if(!ack){ws.close(4000,'Heartbeat timeout');return}ack=false;ws.send(JSON.stringify({op:1,d:gatewaySeq}))};beat();heartbeatTimer=setInterval(beat,p.d.heartbeat_interval);if(gatewaySession&&gatewaySeq!==null){ws.send(JSON.stringify({op:6,d:{token,session_id:gatewaySession,seq:gatewaySeq}}))}else{ws.send(JSON.stringify({op:2,d:{token,intents:GATEWAY_INTENTS,properties:{os:'web',browser:'WebCord',device:'WebCord'}}}))}return}if(p.op===11){ack=true;return}if(p.op===7){ws.close(4000,'Reconnect requested');return}if(p.op===9){if(!p.d){gatewaySession=null;gatewaySeq=null}ws.close(4000,'Invalid session');return}if(p.op!==0)return;if(p.t==='READY'){gatewaySession=p.d.session_id;gatewayUrl=p.d.resume_gateway_url||gatewayUrl;reconnectAttempts=0;status(`${p.d.user?.username||'Bot'} · リアルタイム接続`,true);$('subtitle').textContent=`${p.d.user?.username||'Bot'} · ${guilds.length} サーバー · ライブ`}else if(p.t==='RESUMED'){reconnectAttempts=0;status('リアルタイム接続',true)}else if(p.t==='MESSAGE_CREATE'&&currentChannel&&p.d.channel_id===currentChannel.id){appendLiveMessage(p.d)}else if(p.t==='MESSAGE_UPDATE'&&currentChannel&&p.d.channel_id===currentChannel.id){loadMessages(true)}else if(p.t==='MESSAGE_DELETE'&&currentChannel&&p.d.channel_id===currentChannel.id){currentMessages=currentMessages.filter(m=>m.id!==p.d.id);seenMessageIds.delete(p.d.id);renderMessages(currentMessages,false)}};ws.onerror=()=>{};ws.onclose=event=>{if(gatewaySocket===ws)gatewaySocket=null;clearInterval(heartbeatTimer);heartbeatTimer=null;if(intentionalClose||!token)return;if([4004,4013,4014].includes(event.code)){gatewayFailed=true;status('Gateway設定を確認');const msg=event.code===4014?'Message Content IntentをDiscord Developer Portalで有効にしてください。':`Gateway接続が拒否されました (${event.code})`;notify(msg,true);return}if([4007,4009].includes(event.code)){gatewaySession=null;gatewaySeq=null}status('再接続中…');const wait=Math.min(1000*2**Math.min(reconnectAttempts++,5),30000);reconnectTimer=setTimeout(()=>{gatewayUrl='';startGateway().catch(e=>notify(e.message,true))},wait)}}
async function loadChannels(){const gid=$('guildSelect').value;currentChannel=null;resetChat();renderGuilds();if(!gid){$('channelSelect').innerHTML='<option>サーバーを選択</option>';$('channelItems').innerHTML='<div class="channel-empty">サーバーを選択してください</div>';return}try{channels=await api(`/guilds/${gid}/channels`);channels=channels.filter(c=>c.type===0||c.type===5);$('channelSelect').innerHTML='<option value="">チャンネルを選択</option>'+channels.map(c=>`<option value="${safe(c.id)}">${safe(c.name)}</option>`).join('');$('channelSelect').disabled=false;$('channelItems').innerHTML=channels.map(c=>`<button class="channel-item" data-channel="${safe(c.id)}"><span class="hash">#</span><span>${safe(c.name)}</span></button>`).join('');$('channelItems').querySelectorAll('[data-channel]').forEach(b=>b.addEventListener('click',()=>{$('channelSelect').value=b.dataset.channel;$('channelSelect').dispatchEvent(new Event('change'))}))}catch(e){notify(e.message,true)}}
async function selectChannel(){const id=$('channelSelect').value;currentChannel=channels.find(c=>c.id===id)||null;$('channelItems').querySelectorAll('.channel-item').forEach(b=>b.classList.toggle('active',b.dataset.channel===id));if(!currentChannel){resetChat();return}$('title').textContent='# '+currentChannel.name;$('subtitle').textContent='最近のメッセージ · ライブ';$('messageInput').disabled=false;$('messageInput').placeholder=`#${currentChannel.name} にメッセージを送信`;$('sendBtn').disabled=false;$('refreshBtn').disabled=false;await loadMessages();$('sidebar').classList.remove('open')}
function time(ts){return new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit'}).format(new Date(ts))}
function renderMessages(msgs,scroll=true){currentMessages=[...msgs].slice(-50);seenMessageIds=new Set(currentMessages.map(m=>m.id));if(!currentMessages.length){$('chat').innerHTML='<div class="welcome"><div class="welcome-card"><div class="welcome-mark">☄</div><h1>まだメッセージがありません</h1><p>このチャンネルに最初のメッセージを送ってみましょう。</p></div></div>';return}$('chat').innerHTML=currentMessages.map(m=>{const name=m.author?.global_name||m.author?.username||'Unknown';const avatar=m.author?.avatar?`https://cdn.discordapp.com/avatars/${m.author.id}/${m.author.avatar}.png?size=64`:'';const initial=safe(name.slice(0,1).toUpperCase());const body=safe(m.content||'').replace(/\n/g,'<br>');const attachments=(m.attachments||[]).map(a=>`<div><a style="color:#aab5ff" href="${safe(a.url)}" target="_blank" rel="noopener">📎 ${safe(a.filename||'添付ファイル')}</a></div>`).join('');return `<article class="message"><div class="avatar" ${avatar?`style="background-image:url('${safe(avatar)}');background-size:cover;font-size:0"`:''}>${avatar?'':initial}</div><div><div class="msg-head"><span class="author">${safe(name)}</span><span class="time">${time(m.timestamp)}</span></div><div class="content">${body}${attachments}</div></div></article>`}).join('');if(scroll)$('chat').scrollTop=$('chat').scrollHeight}
function appendLiveMessage(m){if(seenMessageIds.has(m.id))return;const chat=$('chat'),nearBottom=chat.scrollHeight-chat.scrollTop-chat.clientHeight<90;currentMessages.push(m);if(currentMessages.length>50)currentMessages.shift();renderMessages(currentMessages,nearBottom)}
async function loadMessages(quiet=false){if(!currentChannel)return;try{const data=await api(`/channels/${currentChannel.id}/messages?limit=50`);renderMessages(data.reverse())}catch(e){if(!quiet)notify(e.message+'。Botにチャンネル閲覧とメッセージ履歴の閲覧権限があるか確認してください。',true)}}
async function send(){const input=$('messageInput'),content=input.value.trim();if(!content||!currentChannel)return;input.disabled=true;$('sendBtn').disabled=true;try{await api(`/channels/${currentChannel.id}/messages`,{method:'POST',body:JSON.stringify({content})});input.value='';await loadMessages();input.focus()}catch(e){notify(e.message+'。送信権限を確認してください。',true)}finally{input.disabled=false;$('sendBtn').disabled=false;input.focus()}}
function disconnect(){stopGateway();token='';guilds=[];channels=[];currentChannel=null;$('token').value='';$('guildSelect').innerHTML='<option>接続後に表示</option>';$('guildSelect').disabled=true;$('serverRail').innerHTML='<button class="server-icon home selected" title="WebCord">W</button>';$('channelSelect').innerHTML='<option>サーバーを選択</option>';$('channelSelect').disabled=true;$('channelItems').innerHTML='<div class="channel-empty">Botを接続してください</div>';$('disconnectBtn').disabled=true;$('refreshBtn').disabled=true;status('未接続');$('subtitle').textContent='Bot API経由で接続します';resetChat();notify('切断しました')}
$('connectBtn').addEventListener('click',connect);$('token').addEventListener('keydown',e=>{if(e.key==='Enter')connect()});$('guildSelect').addEventListener('change',loadChannels);$('channelSelect').addEventListener('change',selectChannel);$('sendBtn').addEventListener('click',send);$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('messageInput').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,150)+'px'});$('refreshBtn').addEventListener('click',()=>loadMessages());$('disconnectBtn').addEventListener('click',disconnect);$('menuBtn').addEventListener('click',()=>$('sidebar').classList.toggle('open'));
})();

</script></body></html>
