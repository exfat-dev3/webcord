<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebCord — Discord Bot Client</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#191b22;--panel2:#20232c;--line:#2c303b;--text:#eef0f6;--muted:#9ca3b4;--accent:#8b9cff;--green:#64d6a0;--red:#ff7e88}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}aside{background:#15171d;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.brand{height:66px;padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;font-weight:750;font-size:16px;letter-spacing:.2px}.logo{width:31px;height:31px;border-radius:10px;background:linear-gradient(135deg,#9aaaff,#6978e6);display:grid;place-items:center;color:white;font-weight:900}.side-content{padding:16px 12px;overflow:auto;flex:1}.eyebrow{font-size:10px;color:#82899a;font-weight:800;letter-spacing:1.25px;margin:6px 8px 9px}.connect{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}.connect label{font-size:12px;color:var(--muted);display:block;margin-bottom:7px}.connect input,.select-wrap select{width:100%;border:1px solid var(--line);background:#111318;color:var(--text);border-radius:8px;padding:10px 11px;outline:none}.connect input:focus,.select-wrap select:focus,textarea:focus{border-color:var(--accent)}button{font:inherit;cursor:pointer;border:0}.primary{width:100%;padding:9px 12px;background:#747ff0;color:white;border-radius:8px;font-weight:700;margin-top:9px}.primary:hover{background:#858ffb}.hint{font-size:11px;color:var(--muted);margin:9px 1px 0;line-height:1.55}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;padding:14px 9px 6px}.dot{width:8px;height:8px;border-radius:50%;background:#737989}.dot.on{background:var(--green);box-shadow:0 0 8px #64d6a055}.section{margin-top:22px}.select-wrap{padding:0 4px}.select-wrap select{appearance:none;cursor:pointer}.server-list{margin-top:20px}.navitem{display:flex;align-items:center;gap:9px;color:#aeb4c2;padding:8px 10px;border-radius:7px;font-size:13px}.navitem.active{color:white;background:#282b38}.navitem .icon{width:19px;text-align:center;color:#a5aeff}.foot{padding:13px 16px;border-top:1px solid var(--line);font-size:11px;color:#7f8695}.main{min-width:0;display:flex;flex-direction:column}.topbar{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.channel-title{font-weight:750;font-size:15px}.channel-sub{color:var(--muted);font-size:11px;margin-top:2px}.top-actions{display:flex;gap:8px;align-items:center}.subtle{background:var(--panel2);color:#c8ccda;padding:8px 11px;border-radius:7px;font-size:12px}.subtle:hover{background:#2b2f3b}.chat{flex:1;overflow:auto;padding:26px max(24px,calc((100% - 900px)/2));scroll-behavior:smooth}.welcome{height:100%;display:grid;place-items:center;text-align:center}.welcome-card{max-width:440px}.welcome-mark{width:62px;height:62px;background:#252938;border:1px solid #34394d;border-radius:20px;display:grid;place-items:center;font-size:28px;margin:0 auto 18px}.welcome h1{font-size:22px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0;line-height:1.7}.empty-note{margin-top:18px;display:inline-block;border:1px solid var(--line);padding:8px 12px;border-radius:8px;font-size:11px;color:#bbc0ce}.message{display:grid;grid-template-columns:38px 1fr;gap:12px;margin:0 0 22px}.avatar{width:36px;height:36px;border-radius:50%;background:#343950;display:grid;place-items:center;color:#d5d9ff;font-weight:750;font-size:13px}.msg-head{display:flex;align-items:baseline;gap:9px;margin:1px 0 4px}.author{font-weight:700}.time{font-size:10px;color:#747b8b}.content{white-space:pre-wrap;overflow-wrap:anywhere;color:#d8dbe4;line-height:1.6}.composer-area{padding:0 max(24px,calc((100% - 900px)/2)) 22px}.composer{background:#20232b;border:1px solid #303440;border-radius:12px;padding:10px 12px;display:flex;align-items:flex-end;gap:10px}.composer textarea{resize:none;max-height:150px;min-height:26px;flex:1;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:4px}.send{background:#7b87f5;color:white;border-radius:8px;width:36px;height:34px;font-size:17px}.send:disabled{opacity:.35;cursor:not-allowed}.compose-help{font-size:10px;color:#767d8d;padding:7px 4px 0}.toast{position:fixed;right:20px;top:18px;background:#282b34;border:1px solid var(--line);padding:11px 15px;border-radius:9px;box-shadow:0 10px 30px #0006;max-width:360px;z-index:3}.toast.error{border-color:#804850;color:#ffc5cb}.hidden{display:none!important}.mobile-head{display:none}@media(max-width:700px){.app{grid-template-columns:205px minmax(0,1fr)}.topbar{padding:0 14px}.chat{padding:20px 14px}.composer-area{padding:0 14px 14px}.top-actions .subtle{font-size:0}.top-actions .subtle:first-letter{font-size:12px}}@media(max-width:540px){.app{grid-template-columns:1fr}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;z-index:2;transform:translateX(-100%);transition:transform .2s;box-shadow:12px 0 30px #0006}.sidebar.open{transform:translateX(0)}.mobile-head{display:block;background:none;color:#cdd2df;font-size:20px;padding:4px 9px 4px 0}.topbar{gap:10px}.channel-title{font-size:14px}}
</style></head>
<body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">W</div> WebCord <span style="font-size:10px;color:#858c9d;font-weight:600">BOT CLIENT</span></div><div class="side-content"><div class="eyebrow">接続</div><div class="connect"><label for="token">Discord Bot Token</label><input id="token" type="password" placeholder="Bot tokenを入力" autocomplete="off" spellcheck="false"><button class="primary" id="connectBtn">接続する</button><div class="hint">トークンは保存せず、このタブ内だけで使用します。共有端末では切断後にタブを閉じてください。</div></div><div class="status"><span class="dot" id="statusDot"></span><span id="statusText">未接続</span></div><div class="section"><div class="eyebrow">サーバー</div><div class="select-wrap"><select id="guildSelect" disabled><option>接続後に表示</option></select></div></div><div class="section"><div class="eyebrow">テキストチャンネル</div><div class="select-wrap"><select id="channelSelect" disabled><option>サーバーを選択</option></select></div></div><div class="section server-list"><div class="navitem active"><span class="icon">#</span><span id="channelNav">チャンネルを選択</span></div></div></div><div class="foot">WebCord · ローカル利用向け</div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;min-width:0"><button class="mobile-head" id="menuBtn" aria-label="メニュー">☰</button><div><div class="channel-title" id="title">チャンネルを選択</div><div class="channel-sub" id="subtitle">Bot API経由で接続します</div></div></div><div class="top-actions"><button class="subtle" id="refreshBtn" disabled>↻　更新</button><button class="subtle" id="disconnectBtn" disabled>切断</button></div></header><section class="chat" id="chat"><div class="welcome"><div class="welcome-card"><div class="welcome-mark">✦</div><h1>WebCordへようこそ</h1><p>左側にBotトークンを入力して接続すると、Botが参加しているサーバーのチャンネルを選んで会話できます。</p><span class="empty-note">Botに必要な権限：チャンネル閲覧・メッセージ送信</span></div></div></section><div class="composer-area"><div class="composer"><textarea id="messageInput" rows="1" placeholder="チャンネルを選択してください" disabled></textarea><button class="send" id="sendBtn" disabled aria-label="送信">➤</button></div><div class="compose-help">Enterで送信 · Shift+Enterで改行</div></div></main></div><div class="toast hidden" id="toast"></div>
<script>
(()=>{'use strict';const API='/api/discord?path=';const $=id=>document.getElementById(id);let token='',guilds=[],channels=[],currentChannel=null,poll=null,busy=false;const safe=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function notify(msg,error=false){const t=$('toast');t.textContent=msg;t.className='toast'+(error?' error':'');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.add('hidden'),4200)}async function api(path,opts={}){const res=await fetch(API+encodeURIComponent(path),{...opts,headers:{'X-Bot-Token':token,'Content-Type':'application/json',...(opts.headers||{})}});if(!res.ok){const raw=await res.text();let detail='';try{const data=JSON.parse(raw);detail=data.message||data.error||''}catch{}throw Error(detail||`API エラー (${res.status}): ${raw.slice(0,240)}`)}return res.status===204?null:res.json()}function status(text,on=false){$('statusText').textContent=text;$('statusDot').classList.toggle('on',on)}function setBusy(v){busy=v;$('connectBtn').disabled=v;$('connectBtn').textContent=v?'接続中…':'接続する'}function resetChat(){ $('chat').innerHTML='<div class="welcome"><div class="welcome-card"><div class="welcome-mark">✦</div><h1>チャンネルを選択</h1><p>サーバーとテキストチャンネルを選ぶと、最近のメッセージが表示されます。</p></div></div>';$('messageInput').disabled=true;$('messageInput').placeholder='チャンネルを選択してください';$('sendBtn').disabled=true;$('title').textContent='チャンネルを選択';$('subtitle').textContent='Bot API経由で接続します';$('channelNav').textContent='チャンネルを選択'}async function connect(){const val=$('token').value.trim();if(!val)return notify('Botトークンを入力してください',true);token=val;setBusy(true);try{const me=await api('/users/@me');if(!me.bot)throw Error('このトークンはBotアカウントではありません');guilds=await api('/users/@me/guilds');$('guildSelect').innerHTML='<option value="">サーバーを選択</option>'+guilds.map(g=>`<option value="${safe(g.id)}">${safe(g.name)}</option>`).join('');$('guildSelect').disabled=false;$('channelSelect').disabled=true;$('disconnectBtn').disabled=false;$('refreshBtn').disabled=true;status(`${me.username} として接続`,true);$('subtitle').textContent=`${me.username} · ${guilds.length} サーバー`;notify('Botとして接続しました');$('sidebar').classList.remove('open')}catch(e){token='';status('接続できません');notify(e.message+'。Botトークンと権限を確認してください。',true)}finally{setBusy(false)}}async function loadChannels(){const gid=$('guildSelect').value;currentChannel=null;resetChat();if(!gid){$('channelSelect').innerHTML='<option>サーバーを選択</option>';return}try{channels=await api(`/guilds/${gid}/channels`);channels=channels.filter(c=>c.type===0||c.type===5);$('channelSelect').innerHTML='<option value="">チャンネルを選択</option>'+channels.map(c=>`<option value="${safe(c.id)}"># ${safe(c.name)}</option>`).join('');$('channelSelect').disabled=false}catch(e){notify(e.message,true)}}async function selectChannel(){const id=$('channelSelect').value;currentChannel=channels.find(c=>c.id===id)||null;if(!currentChannel){resetChat();return} $('title').textContent='# '+currentChannel.name;$('channelNav').textContent='# '+currentChannel.name;$('subtitle').textContent='最近のメッセージ';$('messageInput').disabled=false;$('messageInput').placeholder=`#${currentChannel.name} にメッセージを送信`;$('sendBtn').disabled=false;$('refreshBtn').disabled=false;await loadMessages();clearInterval(poll);poll=setInterval(()=>loadMessages(true),12000);$('sidebar').classList.remove('open')}function time(ts){return new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit'}).format(new Date(ts))}function renderMessages(msgs){if(!msgs.length){$('chat').innerHTML='<div class="welcome"><div class="welcome-card"><div class="welcome-mark">☄</div><h1>まだメッセージがありません</h1><p>このチャンネルに最初のメッセージを送ってみましょう。</p></div></div>';return}msgs.reverse();$('chat').innerHTML=msgs.map(m=>{const name=m.author?.global_name||m.author?.username||'Unknown';const avatar=m.author?.avatar?`https://cdn.discordapp.com/avatars/${m.author.id}/${m.author.avatar}.png?size=64`:'';const initial=safe(name.slice(0,1).toUpperCase());const body=safe(m.content||'').replace(/\n/g,'<br>');const attachments=(m.attachments||[]).map(a=>`<div><a style="color:#aab5ff" href="${safe(a.url)}" target="_blank" rel="noopener">📎 ${safe(a.filename||'添付ファイル')}</a></div>`).join('');return `<article class="message"><div class="avatar" ${avatar?`style="background-image:url('${safe(avatar)}');background-size:cover;font-size:0"`:''}>${avatar?'':initial}</div><div><div class="msg-head"><span class="author">${safe(name)}</span><span class="time">${time(m.timestamp)}</span></div><div class="content">${body}${attachments}</div></div></article>`}).join('');$('chat').scrollTop=$('chat').scrollHeight}async function loadMessages(quiet=false){if(!currentChannel)return;try{const data=await api(`/channels/${currentChannel.id}/messages?limit=50`);renderMessages(data)}catch(e){if(!quiet)notify(e.message+'。Botにチャンネル閲覧とメッセージ履歴の閲覧権限があるか確認してください。',true)}}async function send(){const input=$('messageInput'),content=input.value.trim();if(!content||!currentChannel)return;input.disabled=true;$('sendBtn').disabled=true;try{await api(`/channels/${currentChannel.id}/messages`,{method:'POST',body:JSON.stringify({content})});input.value='';await loadMessages();input.focus()}catch(e){notify(e.message+'。送信権限を確認してください。',true)}finally{input.disabled=false;$('sendBtn').disabled=false;input.focus()}}function disconnect(){clearInterval(poll);poll=null;token='';guilds=[];channels=[];currentChannel=null;$('token').value='';$('guildSelect').innerHTML='<option>接続後に表示</option>';$('guildSelect').disabled=true;$('channelSelect').innerHTML='<option>サーバーを選択</option>';$('channelSelect').disabled=true;$('disconnectBtn').disabled=true;$('refreshBtn').disabled=true;status('未接続');$('subtitle').textContent='Bot API経由で接続します';resetChat();notify('切断しました')}$('connectBtn').addEventListener('click',connect);$('token').addEventListener('keydown',e=>{if(e.key==='Enter')connect()});$('guildSelect').addEventListener('change',loadChannels);$('channelSelect').addEventListener('change',selectChannel);$('sendBtn').addEventListener('click',send);$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('messageInput').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,150)+'px'});$('refreshBtn').addEventListener('click',()=>loadMessages());$('disconnectBtn').addEventListener('click',disconnect);$('menuBtn').addEventListener('click',()=>$('sidebar').classList.toggle('open'));})();
</script></body></html>
